<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 230" width="1090" height="230"><rect width="1090" height="230" fill="#FFFFFF"/><defs><marker id="ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#0B6BCB"/></marker></defs><text x="20" y="30" font-family="Barlow Condensed,Arial" font-size="20" font-weight="700" fill="#F0265D">A vida de um dado pessoal</text><g><rect x="20" y="90" width="130" height="56" rx="6" fill="#FDF2F6" stroke="#F0265D" stroke-width="1.5"/><text x="85" y="112" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="600" fill="#1D1A22">cadastro</text><text x="85" y="130" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#726B7C">CPF real</text></g><line x1="150" y1="118" x2="185" y2="118" stroke="#0B6BCB" stroke-width="2" marker-end="url(#ponta)"/><g><rect x="190" y="90" width="130" height="56" rx="6" fill="#E7F5EC" stroke="#0A7D3F" stroke-width="1.5"/><text x="255" y="112" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="600" fill="#1D1A22">log</text><text x="255" y="130" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#726B7C">mudança real · 24 h</text></g><line x1="320" y1="118" x2="355" y2="118" stroke="#0B6BCB" stroke-width="2" marker-end="url(#ponta)"/><g><rect x="360" y="90" width="130" height="56" rx="6" fill="#EFEDF2" stroke="#DFDBE5" stroke-width="1.5"/><text x="425" y="112" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="600" fill="#1D1A22">bronze</text><text x="425" y="130" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#726B7C">CPF real</text></g><line x1="490" y1="118" x2="525" y2="118" stroke="#0B6BCB" stroke-width="2" marker-end="url(#ponta)"/><g><rect x="530" y="90" width="130" height="56" rx="6" fill="#E8F1FC" stroke="#0B6BCB" stroke-width="1.5"/><text x="595" y="112" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="600" fill="#1D1A22">silver</text><text x="595" y="130" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#726B7C">pseudônimo</text></g><line x1="660" y1="118" x2="695" y2="118" stroke="#0B6BCB" stroke-width="2" marker-end="url(#ponta)"/><g><rect x="700" y="90" width="130" height="56" rx="6" fill="#E7F5EC" stroke="#0A7D3F" stroke-width="1.5"/><text x="765" y="112" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="600" fill="#1D1A22">gold</text><text x="765" y="130" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#726B7C">agregado</text></g><line x1="830" y1="118" x2="865" y2="118" stroke="#0B6BCB" stroke-width="2" marker-end="url(#ponta)"/><g><rect x="870" y="90" width="130" height="56" rx="6" fill="#FDECEC" stroke="#C1121F" stroke-width="1.5"/><text x="935" y="112" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="600" fill="#1D1A22">eliminação</text><text x="935" y="130" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#726B7C">ausente</text></g><text x="20" y="190" font-family="Segoe UI,Arial" font-size="12" fill="#726B7C">O CPF real vive só na origem e na bronze; na silver vira pseudônimo; o esquecimento mata o vínculo.</text></svg>